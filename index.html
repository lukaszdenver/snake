<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0e14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100%;
      height: auto;
      padding: 16px 0;
      box-sizing: border-box;
    }
    #score {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    canvas {
      display: block;
      border: 1px solid #1a2030;
      border-radius: 4px;
    }
    #ranking {
      width: 480px;
      max-width: calc(100vw - 32px);
    }
    #ranking h2 {
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      margin: 0 0 6px;
    }
    #top-status {
      color: #94a3b8;
      margin: 0;
    }
    #top-list {
      margin: 0;
      padding-left: 28px;
      font-variant-numeric: tabular-nums;
    }
    #top-list li { padding: 2px 0; }
    #save-form {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    #save-form[hidden], #save-msg[hidden], #top-status[hidden] { display: none; }
    #save-form input {
      flex: 1;
      font: inherit;
      padding: 6px 10px;
      color: #e2e8f0;
      background: #10141c;
      border: 1px solid #334155;
      border-radius: 4px;
    }
    #save-form button {
      font: inherit;
      font-weight: 600;
      padding: 6px 14px;
      color: #10141c;
      background: #e2e8f0;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    #save-form button:disabled { opacity: 0.5; cursor: default; }
    #save-msg {
      color: #ef4444;
      margin: 0 0 8px;
    }
  </style>
</head>
<body>
  <div id="score">Punkty: 0</div>
  <canvas id="board" width="480" height="480"></canvas>

  <section id="ranking">
    <form id="save-form" hidden>
      <input id="name-input" type="text" maxlength="20" placeholder="Twoje imię" aria-label="Twoje imię" autocomplete="nickname">
      <button id="save-btn" type="submit">Zapisz</button>
    </form>
    <p id="save-msg" hidden>Nie udało się zapisać — spróbuj ponownie</p>
    <h2>Top 10</h2>
    <p id="top-status">Ładowanie…</p>
    <ol id="top-list"></ol>
  </section>

  <script src="snake-logic.js"></script>
  <script src="ranking.js"></script>
  <script src="tlo-animacja.js"></script>
  <script>
    (function () {
      'use strict';

      var L = window.SnakeLogic;
      var R = window.SnakeRanking;
      var NAME_KEY = 'snake.imie';
      var FOCUS_DELAY_MS = 400;
      var CELL = 24;
      var MAX_STEPS_PER_FRAME = 5;
      var COLORS = {
        bg: '#10141c',
        grid: '#1a2030',
        head: '#ffffff',
        food: '#ef4444',
        text: '#e2e8f0'
      };

      // Grafiki; dopóki plik się nie wczyta (albo gdy go brak), element rysuje się zastępczo kolorem.
      function loadImage(src) {
        var img = new Image();
        img.src = src;
        return img;
      }

      function isLoaded(img) {
        return img.complete && img.naturalWidth > 0;
      }

      var IMAGES = {
        bg: loadImage('img/tlo.jpg'),
        head: loadImage('img/glowa.png'),
        fruits: [loadImage('img/jablko.png'), loadImage('img/wisnia.png'), loadImage('img/winogrono.png')]
      };
      var fruitIndex = 0;
      var fruitKey = null;   // pozycja jedzenia, dla której wylosowano owoc

      var KEY_TO_DIR = {
        arrowup: 'up', w: 'up',
        arrowdown: 'down', s: 'down',
        arrowleft: 'left', a: 'left',
        arrowright: 'right', d: 'right'
      };

      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var sky = window.SnakeSky.createSky(canvas.width, canvas.height);
      var reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      var scoreEl = document.getElementById('score');
      var formEl = document.getElementById('save-form');
      var inputEl = document.getElementById('name-input');
      var btnEl = document.getElementById('save-btn');
      var msgEl = document.getElementById('save-msg');
      var topStatusEl = document.getElementById('top-status');
      var topListEl = document.getElementById('top-list');

      var state = L.createState();
      var accumulator = 0;
      var lastTime = null;
      var topList = null;      // null = lista niewczytana albo błąd pobierania
      var gameId = 0;          // rośnie przy każdej nowej grze; chroni przed spóźnionymi odpowiedziami
      var newRecord = false;   // bieżący wynik czeka na zapis w top 10
      var submitting = false;

      function loadName() {
        try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
      }

      function saveName(name) {
        try { localStorage.setItem(NAME_KEY, name); } catch (e) { /* brak dostępu nie psuje gry */ }
      }

      function renderTop() {
        topListEl.textContent = '';
        if (topList === null || topList.length === 0) {
          topStatusEl.textContent = topList === null ? 'Ranking niedostępny' : 'Brak wyników — bądź pierwszy!';
          topStatusEl.hidden = false;
          return;
        }
        topStatusEl.hidden = true;
        topList.forEach(function (w) {
          var li = document.createElement('li');
          li.textContent = w.imie + ' — ' + w.punkty;
          topListEl.appendChild(li);
        });
      }

      function refreshTop() {
        return R.fetchTop().then(
          function (rows) { topList = rows; },
          function () { topList = null; }
        ).then(renderTop);
      }

      function hideForm() {
        newRecord = false;
        formEl.hidden = true;
        msgEl.hidden = true;
        if (formEl.contains(document.activeElement)) document.activeElement.blur();
      }

      // Wywoływane raz, w klatce, w której gra przeszła z 'running' na 'over' albo 'won'.
      function onGameEnd() {
        newRecord = topList !== null && R.qualifies(topList, state.score);
        if (!newRecord) return;
        inputEl.value = loadName();
        msgEl.hidden = true;
        btnEl.disabled = submitting;
        formEl.hidden = false;
        var forGame = gameId;
        // Opóźnienie: klawisze WSAD wciśnięte tuż przed śmiercią nie nadpisują zapamiętanego imienia.
        setTimeout(function () {
          if (forGame !== gameId || formEl.hidden) return;
          inputEl.focus();
          inputEl.select();
        }, FOCUS_DELAY_MS);
      }

      function newGame() {
        state = L.createState();
        accumulator = 0;
        gameId++;
        hideForm();
      }

      formEl.addEventListener('submit', function (e) {
        e.preventDefault();
        if (submitting) return;
        var name = R.normalizeName(inputEl.value);
        if (name === null) {
          inputEl.focus();
          return;
        }
        var forGame = gameId;
        submitting = true;
        btnEl.disabled = true;
        msgEl.hidden = true;
        R.submit(name, state.score).then(function () {
          saveName(name);
          if (forGame === gameId) hideForm();
          return refreshTop();
        }, function () {
          // Po restarcie albo zamknięciu formularza (Esc) komunikat nie miałby czego dotyczyć.
          if (forGame === gameId && !formEl.hidden) msgEl.hidden = false;
        }).then(function () {
          submitting = false;
          btnEl.disabled = false;
        });
      });

      formEl.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hideForm();
      });

      document.addEventListener('keydown', function (e) {
        // Pisanie imienia (także fokus na przycisku) nie steruje wężem i nie restartuje gry.
        if (formEl.contains(e.target)) return;
        var key = e.key.toLowerCase();
        var dirName = KEY_TO_DIR[key];
        var isRestartKey = key === ' ' || key === 'enter';

        if (key.indexOf('arrow') === 0 || key === ' ') e.preventDefault();

        if (dirName) {
          if (state.status === 'ready') {
            L.start(state);
            accumulator = 0;
          }
          if (state.status === 'running') L.enqueueDirection(state, L.DIRECTIONS[dirName]);
        } else if (isRestartKey && (state.status === 'over' || state.status === 'won')) {
          newGame();
        }
      });

      function drawBackground(now) {
        if (isLoaded(IMAGES.bg)) {
          ctx.drawImage(IMAGES.bg, 0, 0, canvas.width, canvas.height);
        } else {
          drawGrid();
        }
        window.SnakeSky.draw(ctx, sky, now, reducedMotion !== null && reducedMotion.matches);
      }

      function drawGrid() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var i = 1; i < state.cols; i++) {
          ctx.moveTo(i * CELL + 0.5, 0);
          ctx.lineTo(i * CELL + 0.5, canvas.height);
        }
        for (var j = 1; j < state.rows; j++) {
          ctx.moveTo(0, j * CELL + 0.5);
          ctx.lineTo(canvas.width, j * CELL + 0.5);
        }
        ctx.stroke();
      }

      function drawCell(cell, color, inset) {
        ctx.fillStyle = color;
        ctx.fillRect(cell.x * CELL + inset, cell.y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
      }

      // Segment ciała z zaokrąglonymi rogami; starsze przeglądarki bez roundRect dostają zwykły kwadrat.
      function drawSegment(cell, color) {
        var inset = 2;
        if (!ctx.roundRect) {
          drawCell(cell, color, inset);
          return;
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(cell.x * CELL + inset, cell.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, 7);
        ctx.fill();
      }

      // Grafika jest zwrócona w prawo, więc obracamy ją o kąt kierunku ruchu.
      function drawSprite(img, cell, size, angle) {
        ctx.save();
        ctx.translate(cell.x * CELL + CELL / 2, cell.y * CELL + CELL / 2);
        if (angle) ctx.rotate(angle);
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();
      }

      function drawFood(food) {
        var key = food.x + ',' + food.y;
        if (key !== fruitKey) {
          fruitKey = key;
          fruitIndex = Math.floor(Math.random() * IMAGES.fruits.length);
        }
        var img = IMAGES.fruits[fruitIndex];
        if (isLoaded(img)) {
          drawSprite(img, food, CELL + 4, 0);
          return;
        }
        ctx.fillStyle = COLORS.food;
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawHead(head, direction) {
        if (isLoaded(IMAGES.head)) {
          drawSprite(IMAGES.head, head, CELL + 2, Math.atan2(direction.y, direction.x));
        } else {
          drawCell(head, COLORS.head, 1);
        }
      }

      // Tęcza wzdłuż ciała: każdy segment przesunięty o stały odcień.
      function bodyColor(index) {
        return 'hsl(' + ((index * 25) % 360) + ', 90%, 60%)';
      }

      function drawOverlay(lines) {
        ctx.fillStyle = 'rgba(16, 20, 28, 0.78)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var mid = canvas.height / 2 - (lines.length - 1) * 18;
        for (var i = 0; i < lines.length; i++) {
          ctx.font = i === 0 ? '600 26px system-ui, sans-serif' : '18px system-ui, sans-serif';
          ctx.fillText(lines[i], canvas.width / 2, mid + i * 36);
        }
      }

      function render(now) {
        drawBackground(now);

        if (state.food) drawFood(state.food);

        for (var i = state.snake.length - 1; i >= 1; i--) drawSegment(state.snake[i], bodyColor(i));
        drawHead(state.snake[0], state.direction);

        scoreEl.textContent = 'Punkty: ' + state.score;

        if (state.status === 'ready') {
          drawOverlay(['Strzałki lub WSAD — start']);
        } else if (state.status === 'over' || state.status === 'won') {
          var lines = [state.status === 'won' ? 'Wygrana! Plansza zapełniona' : 'Koniec gry · Punkty: ' + state.score];
          if (newRecord) lines.push('Nowy wynik w top 10 — wpisz imię pod planszą');
          lines.push('Spacja — nowa gra');
          drawOverlay(lines);
        }
      }

      function frame(now) {
        if (lastTime === null) lastTime = now;
        var dt = now - lastTime;
        lastTime = now;

        if (state.status === 'running') {
          // Górny limit akumulatora chroni przed lawiną kroków po powrocie z nieaktywnej karty.
          accumulator = Math.min(accumulator + dt, state.intervalMs * MAX_STEPS_PER_FRAME);
          var steps = 0;
          while (accumulator >= state.intervalMs && state.status === 'running' && steps < MAX_STEPS_PER_FRAME) {
            accumulator -= state.intervalMs;
            L.step(state);
            steps++;
          }
          if (state.status === 'over' || state.status === 'won') onGameEnd();
        } else {
          accumulator = 0;
        }

        render(now);
        requestAnimationFrame(frame);
      }

      refreshTop();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
