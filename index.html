<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0e14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100%;
      height: auto;
      padding: 16px 0;
      box-sizing: border-box;
    }
    #score {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    canvas {
      display: block;
      border: 1px solid #1a2030;
      border-radius: 4px;
    }
    #topbar {
      width: 480px;
      max-width: calc(100vw - 32px);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    #player { color: #94a3b8; }
    #player strong { color: #e2e8f0; }
    .link {
      font: inherit;
      color: #93c5fd;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }
    #board-wrap { position: relative; }
    #auth-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      max-width: calc(100% - 32px);
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(16, 20, 28, 0.94);
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .tabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .tab {
      flex: 1;
      font: inherit;
      padding: 6px 0;
      color: #94a3b8;
      background: none;
      border: 0;
      border-bottom: 2px solid #334155;
      cursor: pointer;
    }
    .tab.active { color: #e2e8f0; border-bottom-color: #e2e8f0; font-weight: 600; }
    #auth-card label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #94a3b8; }
    #auth-card input {
      font: inherit;
      padding: 6px 10px;
      color: #e2e8f0;
      background: #10141c;
      border: 1px solid #334155;
      border-radius: 4px;
    }
    .primary {
      font: inherit;
      font-weight: 600;
      padding: 8px 14px;
      color: #10141c;
      background: #e2e8f0;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .primary:disabled { opacity: 0.5; cursor: default; }
    #auth-msg { color: #fca5a5; margin: 0; font-size: 14px; }
    #save-status { margin: 0; color: #94a3b8; }
    #ranking {
      width: 480px;
      max-width: calc(100vw - 32px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 520px) {
      #ranking { grid-template-columns: 1fr; }
    }
    #ranking h2 {
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      margin: 0 0 6px;
    }
    .muted { color: #94a3b8; margin: 0; }
    #ranking ol {
      margin: 0;
      padding-left: 28px;
      font-variant-numeric: tabular-nums;
    }
    #ranking li { padding: 2px 0; }
    #ranking li.me { color: #fde68a; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="score">Punkty: 0</div>
    <div id="player" hidden>Gracz: <strong id="player-login"></strong> · <button id="logout-btn" class="link" type="button">Wyloguj</button></div>
  </div>

  <div id="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <form id="auth-card" hidden novalidate>
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Zaloguj</button>
        <button id="tab-signup" class="tab" type="button">Załóż konto</button>
      </div>
      <label>Login <input id="auth-login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Hasło <input id="auth-password" type="password" autocomplete="current-password"></label>
      <label id="repeat-row" hidden>Powtórz hasło <input id="auth-repeat" type="password" autocomplete="new-password"></label>
      <p id="auth-msg" hidden></p>
      <button id="auth-submit" class="primary" type="submit">Zaloguj</button>
    </form>
  </div>

  <p id="save-status" hidden><span id="save-text"></span> <button id="retry-btn" class="link" type="button" hidden>Spróbuj ponownie</button></p>

  <section id="ranking" hidden>
    <div>
      <h2>Moje najlepsze</h2>
      <p id="my-status" class="muted">Ładowanie…</p>
      <ol id="my-list"></ol>
    </div>
    <div>
      <h2>Top 10 wszystkich</h2>
      <p id="global-status" class="muted">Ładowanie…</p>
      <ol id="global-list"></ol>
    </div>
  </section>

  <script src="snake-logic.js"></script>
  <script src="konto.js"></script>
  <script src="ranking.js"></script>
  <script src="tlo-animacja.js"></script>
  <script>
    (function () {
      'use strict';

      var L = window.SnakeLogic;
      var R = window.SnakeRanking;
      var A = window.SnakeAccount;
      var CELL = 24;
      var MAX_STEPS_PER_FRAME = 5;
      var COLORS = {
        bg: '#10141c',
        grid: '#1a2030',
        head: '#ffffff',
        food: '#ef4444',
        text: '#e2e8f0'
      };

      // Grafiki; dopóki plik się nie wczyta (albo gdy go brak), element rysuje się zastępczo kolorem.
      function loadImage(src) {
        var img = new Image();
        img.src = src;
        return img;
      }

      function isLoaded(img) {
        return img.complete && img.naturalWidth > 0;
      }

      var IMAGES = {
        bg: loadImage('img/tlo.jpg'),
        head: loadImage('img/glowa.png'),
        fruits: [loadImage('img/jablko.png'), loadImage('img/wisnia.png'), loadImage('img/winogrono.png')]
      };
      var fruitIndex = 0;
      var fruitKey = null;   // pozycja jedzenia, dla której wylosowano owoc

      var KEY_TO_DIR = {
        arrowup: 'up', w: 'up',
        arrowdown: 'down', s: 'down',
        arrowleft: 'left', a: 'left',
        arrowright: 'right', d: 'right'
      };

      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var sky = window.SnakeSky.createSky(canvas.width, canvas.height);
      var reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      var scoreEl = document.getElementById('score');
      var playerEl = document.getElementById('player');
      var playerLoginEl = document.getElementById('player-login');
      var logoutBtn = document.getElementById('logout-btn');
      var authCard = document.getElementById('auth-card');
      var tabLogin = document.getElementById('tab-login');
      var tabSignup = document.getElementById('tab-signup');
      var loginEl = document.getElementById('auth-login');
      var passwordEl = document.getElementById('auth-password');
      var repeatRow = document.getElementById('repeat-row');
      var repeatEl = document.getElementById('auth-repeat');
      var authMsgEl = document.getElementById('auth-msg');
      var authSubmitBtn = document.getElementById('auth-submit');
      var saveStatusEl = document.getElementById('save-status');
      var saveTextEl = document.getElementById('save-text');
      var retryBtn = document.getElementById('retry-btn');
      var rankingEl = document.getElementById('ranking');
      var myStatusEl = document.getElementById('my-status');
      var myListEl = document.getElementById('my-list');
      var globalStatusEl = document.getElementById('global-status');
      var globalListEl = document.getElementById('global-list');

      var MESSAGES = {
        bad_login: 'Login: 3–20 znaków — litery, cyfry, _',
        too_short: 'Hasło musi mieć co najmniej 8 znaków',
        too_long: 'Hasło jest za długie',
        mismatch: 'Hasła się różnią',
        login_taken: 'Ten login jest już zajęty',
        invalid_credentials: 'Zły login lub hasło',
        weak_password: 'Hasło jest za słabe',
        network: 'Brak połączenia — spróbuj ponownie',
        unknown: 'Coś poszło nie tak — spróbuj ponownie',
        session_expired: 'Sesja wygasła — zaloguj się ponownie'
      };

      var state = L.createState();
      var accumulator = 0;
      var lastTime = null;
      var session = null;       // zalogowany gracz albo null
      var authEpoch = 0;        // rośnie przy każdym zalogowaniu i wylogowaniu; odpowiedzi ze starej epoki są ignorowane
      var gameId = 0;           // rośnie przy każdej nowej grze; chroni przed spóźnionymi odpowiedziami zapisu
      var mode = 'login';       // 'login' albo 'signup'
      var authBusy = false;
      var myTop = null;         // null = lista niewczytana albo błąd pobierania
      var globalTop = null;
      var personalBest = false;
      var saving = false;
      var retryScore = 0;

      function setMode(next) {
        mode = next;
        tabLogin.classList.toggle('active', next === 'login');
        tabSignup.classList.toggle('active', next === 'signup');
        repeatRow.hidden = next !== 'signup';
        passwordEl.autocomplete = next === 'signup' ? 'new-password' : 'current-password';
        authSubmitBtn.textContent = next === 'signup' ? 'Załóż konto' : 'Zaloguj';
        showAuthMessage(null);
      }

      function showAuthMessage(text) {
        authMsgEl.textContent = text || '';
        authMsgEl.hidden = !text;
      }

      function showSaveStatus(text, canRetry) {
        saveTextEl.textContent = text;
        retryBtn.hidden = !canRetry;
        saveStatusEl.hidden = false;
      }

      function blurInside(el) {
        if (el.contains(document.activeElement)) document.activeElement.blur();
      }

      function newGame() {
        state = L.createState();
        accumulator = 0;
        gameId++;
        personalBest = false;
        saving = false;
        saveStatusEl.hidden = true;
      }

      function showLoggedOut(message) {
        authEpoch++;
        session = null;
        myTop = null;
        globalTop = null;
        newGame();
        playerEl.hidden = true;
        rankingEl.hidden = true;
        passwordEl.value = '';
        repeatEl.value = '';
        setMode('login');
        showAuthMessage(message);
        authCard.hidden = false;
        loginEl.focus();
      }

      function showLoggedIn(s) {
        authEpoch++;
        session = s;
        newGame();
        passwordEl.value = '';
        repeatEl.value = '';
        blurInside(authCard);
        authCard.hidden = true;
        playerLoginEl.textContent = s.login;
        playerEl.hidden = false;
        myTop = null;
        globalTop = null;
        renderLists(true);
        rankingEl.hidden = false;
        refreshLists();
      }

      // Ważna sesja dla zapytania; gdy nie da się jej odnowić, gracz wraca do karty logowania.
      function withSession(epoch, fn) {
        return A.validSession().then(function (s) {
          if (epoch !== authEpoch) throw new Error('stale');
          // W innej karcie zalogował się ktoś inny: przełączamy się na niego, a bieżące zapytanie przepada,
          // żeby wynik tej gry nie trafił na cudze konto.
          if (s.user_id !== session.user_id) {
            showLoggedIn(s);
            throw new Error('stale');
          }
          session = s;
          return fn(s);
        }, function (err) {
          if (err && err.code === 'session_expired' && epoch === authEpoch) showLoggedOut(MESSAGES.session_expired);
          throw err;
        });
      }

      function formatDate(iso) {
        var d = new Date(iso);
        function two(n) { return (n < 10 ? '0' : '') + n; }
        return two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear();
      }

      function renderList(listEl, statusEl, rows, emptyText, fill, loading) {
        listEl.textContent = '';
        if (loading || rows === null || rows.length === 0) {
          statusEl.textContent = loading ? 'Ładowanie…' : rows === null ? 'Ranking niedostępny' : emptyText;
          statusEl.hidden = false;
          return;
        }
        statusEl.hidden = true;
        rows.forEach(function (row) {
          var li = document.createElement('li');
          fill(li, row);
          listEl.appendChild(li);
        });
      }

      function renderLists(loading) {
        renderList(myListEl, myStatusEl, myTop, 'Brak wyników — zagraj pierwszą grę!', function (li, w) {
          li.textContent = w.punkty + ' pkt · ' + formatDate(w.utworzono);
        }, loading);
        renderList(globalListEl, globalStatusEl, globalTop, 'Brak wyników — bądź pierwszy!', function (li, w) {
          li.textContent = w.login + ' — ' + w.punkty;
          if (session && w.login === session.login) li.className = 'me';
        }, loading);
      }

      function refreshLists() {
        var epoch = authEpoch;
        withSession(epoch, function (s) {
          // Każda lista osobno: błąd jednej nie gasi drugiej.
          return Promise.all([
            R.fetchMyTop(s).then(null, function () { return null; }),
            R.fetchGlobalTop(s).then(null, function () { return null; })
          ]);
        }).then(function (lists) {
          if (epoch !== authEpoch) return;
          myTop = lists[0];
          globalTop = lists[1];
          renderLists(false);
        }, function () {
          if (epoch !== authEpoch) return;
          myTop = null;
          globalTop = null;
          renderLists(false);
        });
      }

      function saveScore(score) {
        var epoch = authEpoch;
        var forGame = gameId;
        saving = true;
        retryScore = score;
        showSaveStatus('Zapisywanie…', false);
        withSession(epoch, function (s) {
          return R.submit(s, score);
        }).then(function () {
          if (epoch !== authEpoch) return;
          if (forGame === gameId) showSaveStatus('Wynik zapisany', false);
          refreshLists();
        }, function (err) {
          // Po wylogowaniu, nowej grze albo wygaśnięciu sesji komunikat nie miałby czego dotyczyć.
          if (epoch !== authEpoch || forGame !== gameId || (err && err.code === 'session_expired')) return;
          showSaveStatus('Nie udało się zapisać', true);
        }).then(function () {
          if (forGame === gameId) saving = false;
        });
      }

      // Wywoływane raz, w klatce, w której gra przeszła z 'running' na 'over' albo 'won'.
      function onGameEnd() {
        personalBest = myTop !== null && R.isPersonalBest(myTop, state.score);
        if (state.score >= 1) saveScore(state.score);
      }

      retryBtn.addEventListener('click', function () {
        if (saving) return;
        saveScore(retryScore);
      });

      tabLogin.addEventListener('click', function () { setMode('login'); });
      tabSignup.addEventListener('click', function () { setMode('signup'); });

      authCard.addEventListener('submit', function (e) {
        e.preventDefault();
        if (authBusy) return;
        var login = A.normalizeLogin(loginEl.value);
        if (login === null) {
          showAuthMessage(MESSAGES.bad_login);
          return;
        }
        var passwordProblem = A.passwordError(passwordEl.value);
        if (passwordProblem) {
          showAuthMessage(MESSAGES[passwordProblem]);
          return;
        }
        if (mode === 'signup' && repeatEl.value !== passwordEl.value) {
          showAuthMessage(MESSAGES.mismatch);
          return;
        }
        authBusy = true;
        authSubmitBtn.disabled = true;
        showAuthMessage(null);
        var attempt = mode === 'signup' ? A.signUp(login, passwordEl.value) : A.signIn(login, passwordEl.value);
        attempt.then(showLoggedIn, function (err) {
          showAuthMessage(MESSAGES[err && err.code] || MESSAGES.unknown);
        }).then(function () {
          authBusy = false;
          authSubmitBtn.disabled = false;
        });
      });

      logoutBtn.addEventListener('click', function () {
        A.signOut();
        showLoggedOut(null);
      });

      document.addEventListener('keydown', function (e) {
        // Pisanie w karcie logowania i klawisze na przyciskach nie sterują wężem i nie restartują gry.
        if (authCard.contains(e.target) || playerEl.contains(e.target) || saveStatusEl.contains(e.target)) return;
        if (!session) return;
        var key = e.key.toLowerCase();
        var dirName = KEY_TO_DIR[key];
        var isRestartKey = key === ' ' || key === 'enter';

        if (key.indexOf('arrow') === 0 || key === ' ') e.preventDefault();

        if (dirName) {
          if (state.status === 'ready') {
            L.start(state);
            accumulator = 0;
          }
          if (state.status === 'running') L.enqueueDirection(state, L.DIRECTIONS[dirName]);
        } else if (isRestartKey && (state.status === 'over' || state.status === 'won')) {
          newGame();
        }
      });

      function drawBackground(now) {
        if (isLoaded(IMAGES.bg)) {
          ctx.drawImage(IMAGES.bg, 0, 0, canvas.width, canvas.height);
        } else {
          drawGrid();
        }
        window.SnakeSky.draw(ctx, sky, now, reducedMotion !== null && reducedMotion.matches);
      }

      function drawGrid() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var i = 1; i < state.cols; i++) {
          ctx.moveTo(i * CELL + 0.5, 0);
          ctx.lineTo(i * CELL + 0.5, canvas.height);
        }
        for (var j = 1; j < state.rows; j++) {
          ctx.moveTo(0, j * CELL + 0.5);
          ctx.lineTo(canvas.width, j * CELL + 0.5);
        }
        ctx.stroke();
      }

      function drawCell(cell, color, inset) {
        ctx.fillStyle = color;
        ctx.fillRect(cell.x * CELL + inset, cell.y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
      }

      // Segment ciała z zaokrąglonymi rogami; starsze przeglądarki bez roundRect dostają zwykły kwadrat.
      function drawSegment(cell, color) {
        var inset = 2;
        if (!ctx.roundRect) {
          drawCell(cell, color, inset);
          return;
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(cell.x * CELL + inset, cell.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, 7);
        ctx.fill();
      }

      // Grafika jest zwrócona w prawo, więc obracamy ją o kąt kierunku ruchu.
      function drawSprite(img, cell, size, angle) {
        ctx.save();
        ctx.translate(cell.x * CELL + CELL / 2, cell.y * CELL + CELL / 2);
        if (angle) ctx.rotate(angle);
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();
      }

      function drawFood(food) {
        var key = food.x + ',' + food.y;
        if (key !== fruitKey) {
          fruitKey = key;
          fruitIndex = Math.floor(Math.random() * IMAGES.fruits.length);
        }
        var img = IMAGES.fruits[fruitIndex];
        if (isLoaded(img)) {
          drawSprite(img, food, CELL + 4, 0);
          return;
        }
        ctx.fillStyle = COLORS.food;
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawHead(head, direction) {
        if (isLoaded(IMAGES.head)) {
          drawSprite(IMAGES.head, head, CELL + 2, Math.atan2(direction.y, direction.x));
        } else {
          drawCell(head, COLORS.head, 1);
        }
      }

      // Tęcza wzdłuż ciała: każdy segment przesunięty o stały odcień.
      function bodyColor(index) {
        return 'hsl(' + ((index * 25) % 360) + ', 90%, 60%)';
      }

      function drawOverlay(lines) {
        ctx.fillStyle = 'rgba(16, 20, 28, 0.78)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var mid = canvas.height / 2 - (lines.length - 1) * 18;
        for (var i = 0; i < lines.length; i++) {
          ctx.font = i === 0 ? '600 26px system-ui, sans-serif' : '18px system-ui, sans-serif';
          ctx.fillText(lines[i], canvas.width / 2, mid + i * 36);
        }
      }

      function render(now) {
        drawBackground(now);

        if (state.food) drawFood(state.food);

        for (var i = state.snake.length - 1; i >= 1; i--) drawSegment(state.snake[i], bodyColor(i));
        drawHead(state.snake[0], state.direction);

        scoreEl.textContent = 'Punkty: ' + state.score;

        if (!session) {
          drawOverlay([]);  // karta logowania leży nad przyciemnioną planszą
        } else if (state.status === 'ready') {
          drawOverlay(['Strzałki lub WSAD — start']);
        } else if (state.status === 'over' || state.status === 'won') {
          var lines = [state.status === 'won' ? 'Wygrana! Plansza zapełniona' : 'Koniec gry · Punkty: ' + state.score];
          if (personalBest) lines.push('Nowy rekord osobisty!');
          lines.push('Spacja — nowa gra');
          drawOverlay(lines);
        }
      }

      function frame(now) {
        if (lastTime === null) lastTime = now;
        var dt = now - lastTime;
        lastTime = now;

        if (state.status === 'running') {
          // Górny limit akumulatora chroni przed lawiną kroków po powrocie z nieaktywnej karty.
          accumulator = Math.min(accumulator + dt, state.intervalMs * MAX_STEPS_PER_FRAME);
          var steps = 0;
          while (accumulator >= state.intervalMs && state.status === 'running' && steps < MAX_STEPS_PER_FRAME) {
            accumulator -= state.intervalMs;
            L.step(state);
            steps++;
          }
          if (state.status === 'over' || state.status === 'won') onGameEnd();
        } else {
          accumulator = 0;
        }

        render(now);
        requestAnimationFrame(frame);
      }

      var restored = A.currentSession();
      if (restored) {
        showLoggedIn(restored);
      } else {
        showLoggedOut(null);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
